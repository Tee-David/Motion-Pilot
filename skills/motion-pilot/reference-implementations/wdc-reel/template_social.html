const eo=x=>1-Math.pow(1-x,3);

const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const xo=x=>x>=1?1:1-Math.pow(2,-10*x);
const xi=x=>x<=0?0:Math.pow(2,10*x-10);
const xio=x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2;
const back=(x,s=1.70158)=>{const c3=s+1;return 1+c3*Math.pow(x-1,3)+s*Math.pow(x-1,2)};
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}

let RT=0; const FW=1920,FH=1080,S1AV=1640,LABAV=690; let S1M=null, LABFIT=0; window.LOOP=false; function blink(t){return (Math.floor(RT*3.6)%2)===0}

/* ---------- build S2 tiles ---------- */

const tiles=TILES.map(([l,c],i)=>{const d=document.createElement('div');d.className='tile';d.innerHTML=`<i style="background:${c}"></i><span>${l}</span>`;$('s2world').appendChild(d);return d});

const L4="Brilliant simplicity";
const s4l=[...L4].map((ch,i)=>{const s=document.createElement('span');s.textContent=ch===' '?'\u00a0':ch;s.style.display='inline-block';$('s4l1').appendChild(s);return s});

const labs=LABS.map(h=>{const d=document.createElement('div');d.className='lab sg';d.innerHTML=h;$('s5labs').appendChild(d);return d});

const beats=[0,1,2,3,4,5].map(()=>{const b=document.createElement('div');b.className='beat';$('s5rig').appendChild(b);return b});
function el(parent,html){const w=document.createElement('div');w.innerHTML=html.trim();const n=w.firstChild;parent.appendChild(n);return n}
// beat 0: branding grid
const B0=["moore-cover","marfaa-cover","millcon-cover","bay-accessories-flyer"].map((n,i)=>el(beats[0],`<div class="card" style="width:380px;height:380px"><img src="assets/work/${n}.jpg"></div>`));
// beat 1: search
const B1card=el(beats[1],`<div class="card" style="width:900px;height:600px;padding:44px;background:#fff"></div>`);
const B1bar=el(B1card,`<div style="height:84px;border-radius:42px;background:#F1F1F7;display:flex;align-items:center;padding:0 32px;gap:20px;font-family:OF;font-size:34px;color:#0e0e2c"><svg width="34" height="34" viewBox="0 0 24 24"><circle cx="10" cy="10" r="7" stroke="#000065" stroke-width="2.6" fill="none"/><path d="M15.5 15.5L21 21" stroke="#000065" stroke-width="2.6" stroke-linecap="round"/></svg><span id="q"></span><span id="curq" class="cur"></span></div>`);
const rows=[];
for(let j=0;j<4;j++){
  const wdc=j===3;
  const r=el(B1card,`<div style="position:absolute;left:44px;width:812px;height:92px;border-radius:18px;display:flex;align-items:center;gap:22px;padding:0 22px"></div>`);
  r.innerHTML = `<div class="sg rk" style="width:58px;height:58px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;letter-spacing:0;${wdc?'background:#FF6500;color:#fff':'background:#EEEEF5;color:#9d9ec9'}"></div>`+
   (wdc?`<img src="assets/icon-color.svg" style="width:46px;height:48px"><div><div class="sg" style="font-size:31px;color:#000065;letter-spacing:-0.02em">We Dig Creativity</div><div class="of" style="font-size:22px;color:#6b6c93">wedigcreativity.com.ng</div></div>`
       :`<div style="width:46px;height:46px;border-radius:50%;background:#E4E4EE"></div><div><div style="width:${300+rnd(j)*160}px;height:20px;border-radius:10px;background:#DCDCE8;margin-bottom:12px"></div><div style="width:${180+rnd(j+9)*80}px;height:14px;border-radius:7px;background:#ECECF3"></div></div>`);
  rows.push(r);
}
// beat 2: web
const B2win=el(beats[2],`<div class="card" style="width:1000px;height:640px;background:#0a0a3a"></div>`);
el(B2win,`<div style="height:56px;background:#e9e9f1;display:flex;align-items:center;gap:10px;padding:0 22px"><b style="width:14px;height:14px;border-radius:50%;background:#ff5f57;display:block"></b><b style="width:14px;height:14px;border-radius:50%;background:#febc2e;display:block"></b><b style="width:14px;height:14px;border-radius:50%;background:#28c840;display:block"></b><div class="of" style="margin-left:24px;height:34px;flex:1;border-radius:17px;background:#fff;display:flex;align-items:center;padding:0 18px;font-size:19px;color:#565678">wedigcreativity.com.ng</div></div>`);
const B2view=el(B2win,`<div style="position:absolute;left:0;top:56px;width:1000px;height:584px;overflow:hidden"><img id="B2img" src="shots/strip.jpg" style="width:1000px;height:auto;object-fit:fill;display:block"></div>`);
const B2float=el(beats[2],`<div class="card" style="width:400px;height:300px;border:6px solid #fff"><img src="assets/work/traxstaff.jpg"></div>`);
// beat 3: apps
function phone(src,bg){return `<div style="position:absolute;width:310px;height:650px;border-radius:52px;background:#0b0b16;padding:12px;box-shadow:0 40px 90px rgba(0,0,0,.55)"><div style="width:286px;height:626px;border-radius:42px;overflow:hidden;position:relative;background:${bg||'#fff'}"><img src="${src}" style="width:286px;height:590px;object-fit:contain;object-position:50% 0;display:block;position:absolute;left:0;top:36px"></div><div style="position:absolute;left:115px;top:22px;width:80px;height:24px;border-radius:12px;background:#0b0b16"></div></div>`}
const B3=[el(beats[3],phone('assets/apps/rp_listings.png','#EEEFF3')),el(beats[3],phone('assets/apps/trax-app-phone.jpg','#f7f8fa')),el(beats[3],phone('assets/apps/rp_dashboard.png','#EEEFF3'))];
// beat 4: software
const B4win=el(beats[4],`<div class="card" style="width:940px;height:540px;background:#fff"><img src="assets/work/litch-dashboard.jpg"></div>`);
const B4back=el(beats[4],`<div class="card" style="width:700px;height:400px;opacity:.9"><img src="assets/work/realtors-dashboard.jpg"></div>`);
const B4chart=el(beats[4],`<div class="card" style="width:420px;height:250px;padding:26px 28px;background:#fff"><div class="of" style="font-size:22px;color:#565678;display:flex;justify-content:space-between"><span>Live report</span><span style="color:#16a34a">● Synced</span></div><svg width="364" height="150" viewBox="0 0 364 150" style="margin-top:14px"><path d="M0 140 L364 140" stroke="#ECECF3" stroke-width="2"/><path id="chartp" d="M0 120 C40 118 60 96 90 100 S140 70 170 78 S220 40 250 52 S310 18 364 10" stroke="#FF6500" stroke-width="6" fill="none" stroke-linecap="round"/></svg></div>`);
// beat 5: social
const B5=["span-fest-artist","party-of-the-year","bay-accessories-flyer"].map(n=>el(beats[5],`<div class="card" style="width:340px;height:420px;border:8px solid #fff"><img src="assets/work/${n}.jpg"></div>`));
const B5p=["New enquiry","Post scheduled","Ad approved"].map(n=>el(beats[5],`<div class="pill"><b></b>${n}</div>`));

/* ---------- S6 ring ---------- */
const RING=["moore-cover","traxstaff","marfaa-cover","speakupforachange","tife-luxe-flyer","realtorspractice","millcon-cover","abebi-treats-flyer","jomorc","skinish-cover","nipsa-efootball","exambeta","dhiol-brand-guide-1","litchconsulting","mariamah-flyer","bamssa-business-summit","nomarcprojects","thinkers-cover"];
const ringEls=RING.map((n,i)=>{const w=i%3===0?240:i%3===1?220:190;const h=i%3===1?220*0.75:w;const d=document.createElement('div');d.className='ringit';d.style.width=w+'px';d.style.height=h+'px';d.innerHTML=`<img src="assets/work/${n}.jpg">`;d.dataset.w=w;d.dataset.h=h;$('ring').appendChild(d);return d});

/* lockup handles */
const L3={top:$('l3top'),bot:$('l3bot'),hands:$('l3hands'),nib:$('l3nib'),cur:$('l3cur'),wm:$('l3wm'),clip:$('l3clip'),sweep:$('l3sweep'),icon:$('l3icon')};
const L7={top:$('l7top'),bot:$('l7bot'),hands:$('l7hands'),nib:$('l7nib'),cur:$('l7cur'),wm:$('l7wm'),clip:$('l7clip'),sweep:$('l7sweep'),icon:$('l7icon')};
const IC='452 472';

let wipeRect=null;
function render(t, frame, rt){ RT=(rt===undefined?t:rt);
  // scene visibility
  show($('s1'),t<2.72); show($('s2'),t>=2.48&&t<4.62); show($('s3'),t>=4.42&&t<7.02);
  show($('s4'),t>=7.0&&t<8.56); show($('s5'),t>=8.28&&t<14.62); show($('s6'),t>=14.28&&t<17.4); show($('s7'),t>=17.0);
  show($('s3'),t>=4.42&&t<8.6); show($('s4'),false);
  loopTail(); $('grain').style.backgroundPosition=`${Math.floor(rnd(frame*3+1)*512)}px ${Math.floor(rnd(frame*7+2)*512)}px`;

  /* ===== S1 ===== */
  if(t<2.72) s1r(t); else $('wipe').style.display='none';

  /* ===== S2 ===== */
  if(t>=2.48&&t<4.62){
    const imp=xi(P(t,3.92,4.45));
    tiles.forEach((d,i)=>{
      const TP=[2.7596, 2.9048, 3.0624, 3.2509, 3.5028, 3.5167, 3.5306, 3.5445, 3.5584, 3.5723, 3.5862, 3.6002]; const pin=P(t,TP[i],TP[i]+0.1); const s=back(pin,2.2);
      const th=i/tiles.length*Math.PI*2+rnd(i)*0.4+(t-2.5)*0.32*(i%2?1:-1)*0.6;
      const rx=640+rnd(i+3)*110, ry=330+rnd(i+5)*60;
      let x=Math.cos(th)*rx, y=Math.sin(th)*ry+Math.sin(t*2+i)*14, z=-380+rnd(i+7)*560; if(Math.abs(y)<200) y=(y>=0?1:-1)*200+y*0.25;
      // chaos jitter grows
      const ch=P(t,3.55,3.9);
      x+=Math.sin(t*23+i*3)*10*ch; y+=Math.cos(t*19+i)*10*ch;
      x*=(1-imp); y*=(1-imp); z=lerp(z,-200,imp);
      const rot=(rnd(i+11)-.5)*16+Math.sin(t*1.5+i)*3+imp*(rnd(i)-.5)*180;
      const sc=Math.max(0,s)*(1-imp*0.92);
      const bl=Math.max(0,-z-120)/110+imp*14;
      d.style.transform=`translate(-50%,-50%) translate3d(${x}px,${y}px,${z}px) rotate(${rot}deg) scale(${sc})`;
      d.style.filter=`blur(${bl}px)`; d.style.opacity=pin>0?Math.min(1,pin*3)*(1-P(t,4.3,4.45)):0;
    });
    const H=$('s2h'); const ph=[["Building a brand?",2.5],["",2.7024],["One big headache.",3.5028],["Fire them all.",3.8335]];
    let k=-1; ph.forEach((p,i)=>{if(t>=p[1]-0.04)k=i});
